{
  "$schema": "../../geocedg/specs/operations/package-profile.schema.json",
  "schema_version": 1,
  "profile_id": "geocedg-windows-internal",
  "application": {
    "name": "GeoCeDG",
    "version": "1.0.0",
    "vendor": "GeoCeDG Project",
    "main_jar": "desktop.jar",
    "main_class": "org.geocedg.desktop.GeoCeDG",
    "icon": "source/desktop/desktop/src/main/resources/org/geocedg/desktop/branding/v1/derived/geocedg-application.ico",
    "upgrade_uuid": "b52d8e6d-3996-4bc5-b9ba-4f51f73c6e44",
    "jvm_options": [
      "--add-exports=java.base/java.lang=ALL-UNNAMED",
      "--add-exports=java.desktop/sun.awt=ALL-UNNAMED",
      "--add-exports=java.desktop/sun.java2d=ALL-UNNAMED",
      "--enable-native-access=ALL-UNNAMED"
    ]
  },
  "toolchain": {
    "gradle_java": 22,
    "desktop_java": 25,
    "wix": "5.0.2",
    "wix_extensions": [
      "WixToolset.Util.wixext/5.0.2",
      "WixToolset.UI.wixext/5.0.2"
    ]
  },
  "input": {
    "gradle_task": ":desktop:desktop:installDist",
    "install_dist": "source/desktop/desktop/build/install/desktop/lib",
    "excluded_native_patterns": [
      "(?i)-natives-linux-",
      "(?i)-natives-macosx-"
    ]
  },
  "outputs": [
    "app-image",
    "zip",
    "msi",
    "exe"
  ],
  "file_association": {
    "installers_only": true,
    "extension": "cedg",
    "mime_type": "application/x-geocedg-cedg",
    "mime_basis": "jdk25-jpackage-required-internal-unregistered",
    "description": "GeoCeDG document (internal evaluation)",
    "progid_strategy": "jdk25-jpackage-generated-geocedg-owned"
  },
  "distribution": {
    "default_profile": "INTERNAL",
    "status": "internal-evaluation",
    "marker": "INTERNAL EVALUATION — NOT FOR REDISTRIBUTION",
    "public_redistribution": "blocked-pending-license-and-asset-approval",
    "profiles": [
      {
        "id": "INTERNAL",
        "status": "internal-evaluation",
        "marker": "INTERNAL EVALUATION — NOT FOR REDISTRIBUTION",
        "public_redistribution": "blocked-pending-license-and-asset-approval",
        "artifact_tag": "internal",
        "redistributable": false,
        "notice_file": "packaging/windows/INTERNAL_EVALUATION_ONLY.txt",
        "association_properties": "packaging/windows/file-associations.properties",
        "association_description": "GeoCeDG document (internal evaluation)"
      },
      {
        "id": "NC",
        "status": "public-non-commercial",
        "marker": "NON-COMMERCIAL DISTRIBUTION — PROFILE NC",
        "public_redistribution": "approved-profile-nc-non-commercial",
        "artifact_tag": "nc",
        "redistributable": true,
        "licensing_profile": "PROFILE NC",
        "licensing_authority": "docs/licensing/geocedg_profile_nc.md",
        "notice_file": "packaging/windows/NC_DISTRIBUTION_NOTICE.txt",
        "association_properties": "packaging/windows/file-associations-nc.properties",
        "association_description": "GeoCeDG document"
      },
      {
        "id": "COMMERCIAL",
        "status": "not-authorized",
        "marker": "COMMERCIAL DISTRIBUTION — NOT AUTHORIZED",
        "public_redistribution": "blocked-pending-external-commercial-terms",
        "artifact_tag": "commercial",
        "redistributable": false,
        "licensing_profile": "PROFILE COMMERCIAL",
        "licensing_authority": "docs/licensing/geocedg_profile_commercial.md",
        "blocking_terms": [
          "GeoGebra License and Collaboration Agreement for the retained GeoGebra Materials",
          "OpenGeoProver rightsholder clarification or commercial permission"
        ]
      }
    ]
  }
}
