    "planned_categories": [
      {
        "id": "descriptive-projections",
        "status": "not-implemented"
      },
      {
        "id": "plane-changes-and-developments",
        "status": "not-implemented"
      },
      {
        "id": "cedg-tools",
        "status": "not-implemented"
      },
      {
        "id": "import-export",
        "status": "not-implemented"
      }
