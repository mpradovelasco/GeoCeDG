{
  "$schema": "../../geocedg/specs/ui/application-profile.schema.json",
  "schema_version": 1,
  "profile_id": "geocedg-desktop",
  "application": {
    "name": "GeoCeDG",
    "preferences_key": "geocedg",
    "windows_app_id": "org.geocedg.desktop",
    "base_profile": "geogebra-classic-5"
  },
  "serialization": {
    "app_code": "classic",
    "policy": "preserve-upstream-g2"
