    "Workspace.Guide": {
      "en": "Length(L) and Length(L,P,Q) return scalar metrics; LocusLength returns rich evidence. Intersect uses the shared rich result: create only eligible exact-token points. Point on Locus V2/Spline V2 uses an explicit semantic preimage. Continuity is OFF. Save native constructions as .cedg.",
      "es": "Length(L) y Length(L,P,Q) devuelven medidas escalares; LocusLength devuelve evidencia rica. Intersect usa el resultado rico compartido: crea solo puntos admisibles con token exacto. Punto sobre Locus V2/Spline V2 usa una preimagen semántica explícita. Continuidad está desactivada. Guarda las construcciones nativas como .cedg."
