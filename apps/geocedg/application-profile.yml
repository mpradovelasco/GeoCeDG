  "localized_text": {
    "Similarity.OrdinaryAxisRequired": {"en": "The built-in coordinate axes have no ordinary persistent object identity. Construct a line explicitly (for example, a: y = 0), then select that line for the semantic reflection.", "es": "Los ejes incorporados no tienen identidad persistente de objeto ordinario. Construya una recta expl\u00edcitamente (por ejemplo, a: y = 0) y selecci\u00f3nela para la reflexi\u00f3n sem\u00e1ntica."},
    "Workspace.Laboratory": {"en": "Open diagnostic legacy resource", "es": "Abrir recurso antiguo de diagn\u00f3stico"},
    "Workspace.LaboratoryWarning": {"en": "This explicit user-selected file opens in a separate diagnostic Classic process with isolated preferences. It is NOT checked against the canonical legacy catalog by this dialog and is not promoted or trusted as scientific authority. For registered, hash-verified canonical resources use tools/legacy/open-laboratory.ps1. No legacy toolbar is installed in the Construction workspace.", "es": "Este archivo elegido expl\u00edcitamente se abre en un proceso Classic de diagn\u00f3stico separado, con preferencias aisladas. Este di\u00e1logo NO lo verifica contra el cat\u00e1logo can\u00f3nico ni lo promueve como autoridad cient\u00edfica. Para recursos can\u00f3nicos registrados y verificados por hash use tools/legacy/open-laboratory.ps1. No se instala ninguna barra antigua en el espacio Construcci\u00f3n."},
    "Workspace.DocumentLayout": {"en": "Document layout", "es": "Disposici\u00f3n del documento"},
    "Workspace.ApplyFailed": {"en": "Workspace change failed. The previous presentation was restored.", "es": "No se pudo cambiar el espacio de trabajo. Se restaur\u00f3 la presentaci\u00f3n anterior."},
