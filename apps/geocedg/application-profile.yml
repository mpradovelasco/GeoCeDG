        "embedded_definition": "3",
        "embedded_size": 240
      },
      {
        "id": "spreadsheet",
        "visible": false,
        "embedded_definition": "1,1",
        "embedded_size": 300
      },
      {
        "id": "cas",
        "visible": false,
        "embedded_definition": "1,3",
        "embedded_size": 300
      },
      {
        "id": "properties",
        "visible": false,
        "embedded_definition": "1,1,1,1",
        "embedded_size": 400
      },
      {
        "id": "euclidian3d",
        "visible": false,
        "embedded_definition": "1,1,1",
        "embedded_size": 500
      }
