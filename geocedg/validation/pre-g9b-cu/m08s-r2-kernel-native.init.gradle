// Opt-in native-file scientific probe only. Never applied by normal build/discovery.
allprojects {
    if (projectDir.absolutePath.replace('\\', '/').endsWith('/source/desktop/desktop')) {
        def repository = new File(projectDir, '../../..').canonicalFile
        plugins.withId('java') {
            sourceSets.test.java.srcDir(new File(repository,
                'geocedg/validation/pre-g9b-cu/m08s-r2-kernel-native-probe'))
        }
        tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
            systemProperty 'geocedg.m08.native.file', System.getProperty(
                'geocedg.m08.native.file', 'C:/Temp/TestM08-S.cedg')
            reports.junitXml.required = true
            reports.junitXml.outputLocation = new File(repository,
                'artifacts/pre-g9b-cu7-i1-r2-kernel/final/native/junit')
            reports.html.required = false
        }
    }
}
