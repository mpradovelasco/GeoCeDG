    "description": "Two-view descriptive-geometry construction of an oblique cone (base circle p, centre B, radius rbCone, apex projections H and I) and a vertical cylinder (circle g_1, centre C_c, radius rbCylinder) offset by excCyl along g. The first locus family is the cone-cylinder intersection; the second is the intersection of the cone with the sphere of centre H and radius HD_1 and its development e_2. The validity of every locus is a characterization subject of PRE-G9B-CU, not an established fact.",
