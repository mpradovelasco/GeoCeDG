      "change": "modified",
      "purpose": "Parse the versioned flat GeoCeDG spatial identity section and carry the explicit native, clipboard, macro, redefine, or rollback load purpose. PRE-G9B-R6-plus-D1: parse the versioned geocedgUnits construction element, apply it only for clearing document, undo and rollback loads, and fail closed on the five recognized defects; paste, evalXML, macro and preferences contexts ignore it. Authority: docs/validation/pre_g9b_r6_plus_d1_candidate_report.md. PRE-G9B-R6-plus-A-2: read the document-level geocedgHiddenLayers element in document parses only, fail closed on the recognized defects and report the set to the application after a completed parse; rollback restores validate without reporting and non-document parses log and ignore the element. Authority: docs/validation/pre_g9b_r6_plus_a2_candidate_report.md.",
