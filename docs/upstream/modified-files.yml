      "change": "modified",
      "purpose": "Own the identity registry and G9A2 semantic runtime and provide the R6 host-wide atomic mutation seam that snapshots/restores the complete Construction around address writes, cascade and postcondition without creating an undo record. Preserve ordinary collected redefinitions without fabricating an empty spatial completion operation; participating transaction and rollback contracts remain unchanged. POST-G9U1-A3-R1 correction: defer collected participating authorization until the complete retained batch has passed serialization preflight, then perform the existing final currentness authorization immediately before the first host mutation. PRE-G9B-R3: rebuild an ordinary edit with the certified version-2 frontier refresh, and capture the existing operation-entry snapshot for an ordinary edit that crosses a version-2 frontier so that a failed certification restores the whole edit; host ordering is unchanged. Authority: geocedg/specs/spatial/durable-dependency-projection.md. PRE-G9B-R6-plus-D1: own the document unit system, write geocedgUnits lazily after worksheetText, reset it on clearConstruction and expose the narrow hasSaveRelevantContent seam; isStarted is unchanged. Authority: docs/validation/pre_g9b_r6_plus_d1_candidate_report.md.",
