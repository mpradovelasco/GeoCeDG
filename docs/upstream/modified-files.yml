      "change": "added",
      "purpose": "Preserve G9A1 atomic identity lifecycle while validating, remapping and publishing exact records, including the R6 interaction-owned semantic-point role only for structurally dedicated inputs and restoring their auxiliary/restricted presentation after identity attachment on reopen. G9U1 review round 1: update affected existing construction dependency records during ordinary late-input participation in the same atomic registry/runtime publication, preserving IDs/schema/revisions and G9A guards; strict native load/copy never repairs stale records. PRE-G9B-R3: validate every construction record under the dependency rule named by its schemaVersion (1 direct, 2 transitive durable frontier) and reject unknown versions; lift the old target to the frontier for assessment; assess typed DURABLE_CONTRACT_CHANGE and UNDESCRIBABLE_PROPOSAL outcomes with the two explicit operation flags and authorize the identity-preserving contract update; upgrade a retained version-1 record inside its own redefine transaction; certify a version-2 frontier refresh after an ordinary-edit rebuild; publish copied construction records as version 2. Authority: geocedg/specs/spatial/durable-dependency-projection.md. PRE-G9B-R3-R1: the late-participation Javadoc distinguishes the version-1 direct inputs from the version-2 frontier walk; no code change.",
