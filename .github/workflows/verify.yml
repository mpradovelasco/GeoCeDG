name: GeoCeDG verification

on:
  pull_request:
  push:
    branches:
      - main
      - integration
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Gradle launcher and Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            22

      - name: Provision G7A Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: om_env
          python-version: "3.12.13"
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install and verify G7A numerical dependency
        shell: pwsh
        run: |
          conda install -n om_env -c conda-forge "mpmath=1.4.1" -y

          Write-Host "G7A Conda environment:"
          conda run -n om_env python --version
          conda run -n om_env python -c "import mpmath; print('mpmath', mpmath.__version__)"

      - name: Run GeoCeDG FULL authority
        shell: pwsh
        run: |
          $logRoot = Join-Path $env:RUNNER_TEMP "geocedg-verify"
          $benchmarkPath = Join-Path $logRoot "operational-benchmark.json"
          .\tools\agent\verify.ps1 `
            -Level FULL `
            -LogDirectory $logRoot `
            -RunBenchmarks `
            -BenchmarkOutputPath $benchmarkPath

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geocedg-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/geocedg-verify
          if-no-files-found: warn
