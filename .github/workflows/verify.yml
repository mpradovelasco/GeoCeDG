name: GeoCeDG verification

on:
  pull_request:
  push:
    branches:
      - main
      - integration
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Gradle launcher and Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            22
            25

      - name: Provision GeoCeDG Python environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: cedg_env
          environment-file: cedg_env.yml
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Verify GeoCeDG Python environment
        shell: pwsh
        run: |
          conda run --no-capture-output -n cedg_env python -c "import json,platform,sys,mpmath; print(json.dumps({'implementation':platform.python_implementation(),'python':platform.python_version(),'executable':sys.executable,'prefix':sys.prefix,'mpmath':mpmath.__version__,'mpmath_file':mpmath.__file__}))"

      - name: Run GeoCeDG FINAL profile
        shell: pwsh
        run: |
          $logRoot = Join-Path $env:RUNNER_TEMP "geocedg-verify"
          .\tools\agent\verify.ps1 -Profile FINAL -LogDirectory $logRoot

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geocedg-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/geocedg-verify
          if-no-files-found: warn
