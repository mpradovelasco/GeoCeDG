name: GeoCeDG verification

on:
  pull_request:
  push:
    branches:
      - main
      - integration
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Gradle launcher and Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            22

      - name: Run GeoCeDG authority
        shell: pwsh
        run: |
          $logRoot = Join-Path $env:RUNNER_TEMP "geocedg-verify"
          .\tools\agent\verify.ps1 `
            -LogDirectory $logRoot `
            -RunBenchmarks `
            -BenchmarkOutputPath (Join-Path $logRoot "operational-benchmark.json")

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geocedg-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/geocedg-verify
          if-no-files-found: warn
